plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Credenciales de firma de release. El fichero key.properties queda fuera
// de git (ver android/.gitignore) y apunta al keystore en ~/.claves-android.
// Si falta, el build de release recae en la clave de depuración.
def propiedadesFirma = new Properties()
def ficheroPropiedadesFirma = rootProject.file("key.properties")
if (ficheroPropiedadesFirma.exists()) {
    ficheroPropiedadesFirma.withReader("UTF-8") { propiedadesFirma.load(it) }
}

android {
    namespace = "com.josu.fosiles.fosiles_flutter"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.josu.fosiles"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (propiedadesFirma["storeFile"]) {
                storeFile = file(propiedadesFirma["storeFile"])
                storePassword = propiedadesFirma["storePassword"]
                keyAlias = propiedadesFirma["keyAlias"]
                keyPassword = propiedadesFirma["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = propiedadesFirma["storeFile"]
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
}
